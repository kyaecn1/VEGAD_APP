<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEGAD - Créer une communauté</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.navbar{background:rgba(15,23,42,.9);backdrop-filter:blur(15px);padding:18px 40px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.05)}
.logo{font-size:22px;font-weight:700}
.vega{color:#60a5fa}
.d{color:#34d399}
.navbar a{color:#94a3b8;text-decoration:none;margin-left:20px;font-size:14px}
.container{max-width:600px;margin:40px auto;padding:0 20px}
.form-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:40px}
h1{color:#fff;margin-bottom:10px;font-size:28px}
.subtitle{color:#94a3b8;margin-bottom:30px;font-size:14px}
.input-group{margin-bottom:20px}
.input-group label{display:block;color:#cbd5e1;font-size:14px;margin-bottom:8px;font-weight:500}
.input-group input,.input-group textarea{width:100%;padding:14px;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.1);border-radius:12px;color:#fff;font-size:15px;font-family:inherit;outline:none;transition:.3s}
.input-group input:focus,.input-group textarea:focus{border-color:#60a5fa;background:rgba(255,255,255,.08);box-shadow:0 0 0 4px rgba(96,165,250,.15)}
.input-group textarea{resize:vertical;min-height:100px}
.btn-submit{width:100%;padding:15px;background:linear-gradient(135deg,#60a5fa,#3b82f6);border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:.3s;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-submit:hover{transform:translateY(-2px);box-shadow:0 10px 25px -5px rgba(59,130,246,.5)}
.back-link{display:block;text-align:center;margin-top:20px;color:#60a5fa;text-decoration:none;font-size:14px}
</style>
</head>
<body>
<nav class="navbar">
<div class="logo"><span class="vega">VEGA</span><span class="d">D</span></div>
<div>
<a href="/admin">Admin</a>
<a href="/communities">Communautés</a>
<a href="/logout">Déconnexion</a>
</div>
</nav>
<div class="container">
<div class="form-card">
<h1>➕ Créer une communauté</h1>
<p class="subtitle">Ajoutez un nouveau quartier à VEGAD</p>
<form method="POST">
<div class="input-group">
<label>Nom de la communauté *</label>
<input type="text" name="name" placeholder="Ex: Quartier Cocody" required>
</div>
<div class="input-group">
<label>Ville</label>
<input type="text" name="city" placeholder="Ex: Abidjan">
</div>
<div class="input-group">
<label>Adresse</label>
<input type="text" name="address" placeholder="Adresse complète">
</div>
<div class="input-group">
<label>Description</label>
<textarea name="description" placeholder="Décrivez ce quartier..."></textarea>
</div>
<button type="submit" class="btn-submit">
<i class="fas fa-plus-circle"></i> Créer la communauté
</button>
</form>
<a href="/admin" class="back-link">← Retour au tableau de bord admin</a>
</div>
</div>
</body>
</html>
