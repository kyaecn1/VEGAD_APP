<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEGAD - Nouvelle alerte</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.navbar{background:rgba(15,23,42,.9);backdrop-filter:blur(15px);padding:18px 40px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.05)}
.logo{font-size:22px;font-weight:700}
.vega{color:#60a5fa}
.d{color:#34d399}
.navbar a{color:#94a3b8;text-decoration:none;margin-left:20px;font-size:14px}
.container{max-width:700px;margin:40px auto;padding:0 20px}
.form-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:40px}
h1{color:#fff;margin-bottom:10px;font-size:28px}
.subtitle{color:#94a3b8;margin-bottom:30px;font-size:14px}
.alert-type-selector{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:25px}
.type-option{padding:20px;border-radius:15px;border:2px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);cursor:pointer;transition:.3s;text-align:center}
.type-option:hover{border-color:rgba(255,255,255,.3)}
.type-option input[type="radio"]{display:none}
.type-option.selected{border-color:#60a5fa;background:rgba(96,165,250,.1)}
.type-option.selected.urgent{border-color:#ef4444;background:rgba(239,68,68,.1)}
.type-icon{font-size:30px;margin-bottom:10px}
.type-title{color:#fff;font-weight:600;margin-bottom:5px}
.type-desc{color:#94a3b8;font-size:12px}
.input-group{margin-bottom:20px}
.input-group label{display:block;color:#cbd5e1;font-size:14px;margin-bottom:8px;font-weight:500}
.input-group input,.input-group textarea,.input-group select{width:100%;padding:14px;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.1);border-radius:12px;color:#fff;font-size:15px;font-family:inherit;outline:none;transition:.3s}
.input-group select option{background:#1e293b}
.input-group input:focus,.input-group textarea:focus,.input-group select:focus{border-color:#60a5fa;background:rgba(255,255,255,.08);box-shadow:0 0 0 4px rgba(96,165,250,.15)}
.input-group textarea{resize:vertical;min-height:120px}
.btn-submit{width:100%;padding:16px;background:linear-gradient(135deg,#60a5fa,#3b82f6);border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:.3s;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-submit:hover{transform:translateY(-2px);box-shadow:0 10px 25px -5px rgba(59,130,246,.5)}
.btn-submit.urgent{background:linear-gradient(135deg,#ef4444,#dc2626)}
.btn-submit.urgent:hover{box-shadow:0 10px 25px -5px rgba(239,68,68,.5)}
.warning-box{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:12px;padding:15px;margin-bottom:20px;color:#fca5a5;font-size:13px;display:none}
.warning-box.show{display:block}
</style>
</head>
<body>
<nav class="navbar">
<div class="logo"><span class="vega">VEGA</span><span class="d">D</span></div>
<div>
<a href="/feed">Tableau de bord</a>
<a href="/alerts">Alertes</a>
<a href="/logout">Déconnexion</a>
</div>
</nav>
<div class="container">
<div class="form-card">
<h1>🚨 Créer une alerte</h1>
<p class="subtitle">Prévenez votre communauté d'un danger</p>
<form method="POST" id="alertForm">
<div class="alert-type-selector">
<label class="type-option selected" id="minorOption">
<input type="radio" name="alert_type" value="minor" checked>
<div class="type-icon">⚠️</div>
<div class="type-title">Alerte mineure</div>
<div class="type-desc">Sera vérifiée par un admin</div>
</label>
<label class="type-option urgent" id="urgentOption">
<input type="radio" name="alert_type" value="urgent">
<div class="type-icon">🚨</div>
<div class="type-title">Alerte urgente</div>
<div class="type-desc">Publiée immédiatement à tous</div>
</label>
</div>
<div class="warning-box" id="warningBox">
⚠️ <strong>Attention :</strong> Une alerte urgente est publiée immédiatement à toute la communauté. Utilisez ce type uniquement en cas de danger réel (feu, vol, accident).
</div>
<div class="input-group">
<label>Titre de l'alerte *</label>
<input type="text" name="title" placeholder="Ex: Voleur aperçu près du marché" required>
</div>
<div class="input-group">
<label>Catégorie *</label>
<select name="category" required>
<option value="suspicious">👤 Personne suspecte</option>
<option value="theft">💰 Vol / Cambriolage</option>
<option value="fire">🔥 Incendie</option>
<option value="accident">🚗 Accident</option>
<option value="other">📌 Autre</option>
</select>
</div>
<div class="input-group">
<label>Description détaillée *</label>
<textarea name="description" placeholder="Décrivez la situation..." required></textarea>
</div>
<div class="input-group">
<label>Adresse / Lieu</label>
<input type="text" name="address" placeholder="Ex: Rue des Jardins, près de la pharmacie">
</div>
<button type="submit" class="btn-submit" id="submitBtn">
<i class="fas fa-paper-plane"></i> Publier l'alerte
</button>
</form>
</div>
</div>
<script>
const minorOption=document.getElementById('minorOption');
const urgentOption=document.getElementById('urgentOption');
const warningBox=document.getElementById('warningBox');
const submitBtn=document.getElementById('submitBtn');
minorOption.addEventListener('click',()=>{
minorOption.classList.add('selected');
urgentOption.classList.remove('selected');
warningBox.classList.remove('show');
submitBtn.classList.remove('urgent');
submitBtn.innerHTML='<i class="fas fa-paper-plane"></i> Publier l\'alerte';
});
urgentOption.addEventListener('click',()=>{
urgentOption.classList.add('selected');
minorOption.classList.remove('selected');
warningBox.classList.add('show');
submitBtn.classList.add('urgent');
submitBtn.innerHTML='<i class="fas fa-exclamation-triangle"></i> Publier l\'URGENCE';
});
</script>
</body>
</html>
